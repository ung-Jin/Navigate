
<!-- 실시간 항만 영상 모달 (static/js/cctv.js 가 열고 닫음) -->
<th:block th:fragment="cctvFragment">

  <div id="cctv-modal" class="cctv-modal">
    <div class="cctv-box">
      <div class="cctv-head">
        <b>실시간 항만 영상</b>
        <button type="button" id="cctv-close" class="cctv-close" title="닫기">✕</button>
      </div>

      <!-- 항구별 영상이 cctv.js 에서 여기에 들어감 -->
      <div id="cctv-body" class="cctv-body"></div>

      <div class="cctv-source">
        출처: 국립해양조사원 항계안전 해양정보 · 영상은 원본 서버에서 바로 재생되며 이 시스템에 저장하지 않습니다.
      </div>
    </div>
  </div>

</th:block>
